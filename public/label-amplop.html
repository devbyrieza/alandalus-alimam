<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Label Amplop Hadiah MOSA CUP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        @page { size: A4 portrait; margin: 10mm; }
        body { margin: 0; padding: 0; background: #e5e7eb; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-family: 'Montserrat', sans-serif; }
        
        .page {
            width: 210mm;
            min-height: 297mm;
            background: white;
            margin: 20px auto;
            padding: 10mm;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }

        @media print {
            body { background: white; margin: 0; }
            .page { margin: 0; padding: 0; box-shadow: none; border: none; width: auto; min-height: auto; }
            .no-print { display: none !important; }
        }

        .label-card {
            border: 2px dashed #9ca3af;
            background: linear-gradient(to bottom right, #ffffff, #fffbeb);
            height: 65mm;
            position: relative;
            overflow: hidden;
        }
        
        .font-title { font-family: 'Cinzel', serif; }
    </style>
</head>
<body>

    <div class="no-print bg-gray-800 text-white p-4 text-center sticky top-0 z-50 shadow-md">
        <h2 class="text-xl font-bold mb-2">Pratinjau Label Amplop Hadiah</h2>
        <p class="text-sm text-gray-300 mb-2">Tekan <kbd class="bg-gray-700 px-2 py-1 rounded">CTRL + P</kbd> untuk mencetak.</p>
        <p class="text-xs text-amber-300">Gunting mengikuti garis putus-putus dan tempel di depan amplop.</p>
    </div>

    <div class="page">
        <div class="grid grid-cols-2 gap-4">
            
            <script>
                const labels = [
                    { kateg: "JUARA 1", nama: "TIM _____________", isi: "VOUCHER JAJAN (20 Tiket)" },
                    { kateg: "JUARA 2", nama: "TIM _____________", isi: "VOUCHER JAJAN (10 Tiket)" },
                    { kateg: "JUARA 3", nama: "TIM _____________", isi: "VOUCHER JAJAN (5 Tiket)" },
                    { kateg: "TIM PALING SPORTIF", nama: "TIM _____________", isi: "VOUCHER JAJAN (___ Tiket)" },
                    { kateg: "TOP SKOR", nama: "Salman Abdul Rohim", isi: "VOUCHER JAJAN (2 Tiket)" },
                    { kateg: "PEMAIN TERBAIK", nama: "Ken Alfarezha Haryadi", isi: "VOUCHER JAJAN (2 Tiket)" },
                    { kateg: "PEMAIN MUDA TERBAIK", nama: "Muh Asrorin Da Silva", isi: "VOUCHER JAJAN (2 Tiket)" },
                    { kateg: "KIPER TERBAIK", nama: "Abdurrahim Pati Raja", isi: "VOUCHER JAJAN (2 Tiket)" }
                ];

                labels.forEach(l => {
                    document.write(`
                        <div class="label-card rounded-xl p-4 flex flex-col justify-between">
                            <div class="flex items-center gap-3 mb-2 border-b-2 border-amber-600 pb-2">
                                <img src="/images/logo.png" alt="Logo" class="h-10 object-contain">
                                <div class="flex-1">
                                    <h4 class="text-[10px] font-bold text-gray-500 uppercase tracking-wider leading-none mb-1">Pesantren Al-Imam</h4>
                                    <h2 class="font-title text-base font-bold text-brand-900 leading-none">MOSA CUP 2026</h2>
                                </div>
                            </div>
                            
                            <div class="text-center flex-1 flex flex-col justify-center">
                                <p class="text-[10px] font-bold text-amber-700 uppercase tracking-widest mb-1">Kategori Penghargaan:</p>
                                <h3 class="text-xl font-black text-gray-900 mb-2 leading-tight">${l.kateg}</h3>
                                
                                <p class="text-[10px] font-medium text-gray-500 uppercase">Diberikan Kepada:</p>
                                <h4 class="text-lg font-bold text-brand-700 leading-tight">${l.nama}</h4>
                            </div>
                            
                            <div class="mt-2 bg-amber-100 border border-amber-300 rounded-lg p-2 text-center">
                                <p class="text-[10px] text-amber-800 font-bold uppercase">Isi Amplop:</p>
                                <p class="text-xs font-black text-amber-900">${l.isi}</p>
                            </div>
                        </div>
                    `);
                });
            </script>

        </div>
    </div>

</body>
</html>
